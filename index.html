<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ملعبنا</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#071b12;color:white;font-family:Arial;text-align:center}
header{background:#087f45;padding:30px 15px;border-radius:0 0 25px 25px}
h1{font-size:32px}
main{padding:20px;max-width:600px;margin:auto}
.card{background:#123b29;padding:22px;margin:16px 0;border-radius:18px}
button{background:#19c56b;color:#062414;border:0;border-radius:12px;padding:13px 22px;font-size:17px;font-weight:bold}
</style>
</head>
<body>
<header>
<h1>⚽ ملعبنا</h1>
<p>كل مبارياتك بمكان واحد</p>
</header>
<main>
<div class="card">
<h2>🏟️ تنظيم مباراة</h2>
<p>رتّب لعبتك واجمع أصدقاءك</p>
<button onclick="alert('قريباً إنشاء مباراة')">إنشاء مباراة</button>
</div>
<div class="card">
<h2>👥 اللاعبون</h2>
<p>نظّم فريقك وأسماء اللاعبين</p>
<button onclick="alert('قريباً إضافة اللاعبين')">اللاعبون</button>
</div>
<div class="card">
<h2>📊 النتائج</h2>
<p>تابع نتائج مباريات فريقك</p>
<button onclick="alert('قريباً سجل النتائج')">النتائج</button>
</div>
</main>
</body>
</html>
